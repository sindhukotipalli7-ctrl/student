<!DOCTYPE html>
<html>
    <head>
        <style>
            .subscribe-button{
                background-color: red;
                color: azure;
                height: 35px;
                width: 105px;
                border: none;
                border-radius: 2px;



            }
            .join-button{
                background-color:white;
        
                height: 35px;
                width: 105px;
                border-color: blue;
                border-radius: 5px;
                border-style: solid;
                border-width: 1px;
                color: blue;
                width: 60px;

            }
            .tweet-button{
                background-color: rgb(0, 166, 255);
                border-radius: 15px;
                border-style: solid;
                border-width: 1px;
                color:white;
                width: 60px;
                height: 35px;
                border: none;
                font: size 16px;
                font-weight: 700;
                cursor: pointer;


            }
        </style>
    </head>
    <body>
        <button class="subscribe-button" >SUBSCRIBE</button>
        <button class="join-button">JOIN</button>
        <button class="tweet-button">TWEET</button>

    </body>
</html>
