<!DOCTYPE html>
<html>

<head>
    <title>To-Do List</title>

    <style>

        

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            margin: 0;
            min-height: 100vh;

            background-image: url("../Images/work.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            backdrop-filter: blur(5px);
            text-align: center;
        }


        

        h1 {
            background: rgba(255, 255, 255, 0.85);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
            
        }



        input,
        select,
        button {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid gray;
        }


        

        button {
            cursor: pointer;
            

        }

        button:hover {
            background-color: #eeeeee;
        }




        #counter {
            background: rgba(255, 255, 255, 0.85);
            display: inline-block;
            padding: 10px;
            border-radius: 8px;
        }


        

        li {
            margin: 10px;
            padding: 10px;
            border: 1px solid gray;

            width: 500px;
            max-width: 90%;

            background: rgba(255, 255, 255, 0.90);

            border-radius: 10px;
        }

        .completed {
            text-decoration: line-through;
        }

        .high {
            color: red;
            font-weight: bold;
        }

        .medium {
            color: orange;
            font-weight: bold;
        }

        .low {
            color: green;
            font-weight: bold;
        }
        #addbutton{
            background-color:green;
                color: azure;
                height: 35px;
                width: 105px;
                border: none;
                

        }
        #clearbutton{
            background-color: red;
                color: azure;
                height: 35px;
                width: 105px;
                border: none;
        }

    </style>
</head>


<body>

    <h1>📝 To-Do List</h1>

    <br>


    <input
        type="text"
        id="taskInput"
        placeholder="Enter task"
    >


    

    <input
        type="date"
        id="taskDate"
    >


    

    <select id="priority">

        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>

    </select>


    

    <button id="addbutton">
        Add Task
    </button>


    

    <button id="clearbutton">
        Clear All
    </button>


    <br>
    <br>


    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search task"
    >




    <select id="filter">

        <option value="all">All</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>

    </select>
    <br><br>


    <h3 id="counter">
        Total: 0 | Completed: 0 | Pending: 0
    </h3>


    

    <ol id="taskList"></ol>


    <script>

        
        let taskInput =
            document.getElementById("taskInput");

        let taskDate =
            document.getElementById("taskDate");

        let priority =
            document.getElementById("priority");

        let addbutton =
            document.getElementById("addbutton");

        let clearbutton =
            document.getElementById("clearbutton");

        let searchInput =
            document.getElementById("searchInput");

        let filter =
            document.getElementById("filter");

        let taskList =
            document.getElementById("taskList");

        let counter =
            document.getElementById("counter");


        let tasks = [];

        let editIndex = -1

        addbutton.addEventListener("click", function () {

            let task = taskInput.value.trim();


            if (task === "") {

                alert("Please enter a task!");

                return;
            }


            

            if (editIndex !== -1) {

                tasks[editIndex].name =
                    task;

                tasks[editIndex].date =
                    taskDate.value;

                tasks[editIndex].priority =
                    priority.value;

                editIndex = -1;

                addbutton.textContent =
                    "Add Task";
            }


            

            else {

                let newTask = {

                    name: task,

                    date: taskDate.value,

                    priority: priority.value,

                    completed: false

                };

                tasks.push(newTask);
            }


    

            taskInput.value = "";

            taskDate.value = "";

            priority.value = "High";


            displayTasks();

        });



        function displayTasks() {

            taskList.innerHTML = "";


            let searchText =
                searchInput.value.toLowerCase();


            let selectedFilter =
                filter.value;


            tasks.forEach(function (task, index) {

                if (
                    !task.name
                        .toLowerCase()
                        .includes(searchText)
                ) {

                    return;
                }


                

                if (
                    selectedFilter === "pending"
                    &&
                    task.completed === true
                ) {

                    return;
                }


                

                if (
                    selectedFilter === "completed"
                    &&
                    task.completed === false
                ) {

                    return;
                }




                let li =
                    document.createElement("li");


        

                let span =
                    document.createElement("span");

                span.textContent =
                    task.name + " ";


                if (task.completed) {

                    span.classList.add(
                        "completed"
                    );

                }


        

                let priorityText =
                    document.createElement("span");

                priorityText.textContent =
                    " [" +
                    task.priority +
                    "] ";


                priorityText.classList.add(
                    task.priority.toLowerCase()
                );
                let dateText =
                    document.createElement("span");


                if (task.date !== "") {

                    dateText.textContent =
                        "📅 " +
                        task.date +
                        " ";

                }


                

                let completebutton =
                    document.createElement("button");

                completebutton.textContent =
                    task.completed
                    ? "Undo"
                    : "Complete";


                completebutton.addEventListener(
                    "click",
                    function () {

                        task.completed =
                            !task.completed;

                        displayTasks();

                    }
                );


                

                let editbutton =
                    document.createElement("button");

                editbutton.textContent =
                    "Edit";


                editbutton.addEventListener(
                    "click",
                    function () {

                        taskInput.value =
                            task.name;

                        taskDate.value =
                            task.date;

                        priority.value =
                            task.priority;

                        editIndex =
                            index;

                        addbutton.textContent =
                            "Update Task";

                        taskInput.focus();

                    }
                );




                let deletebutton =
                    document.createElement("button");

                deletebutton.textContent =
                    "Delete";


                deletebutton.addEventListener(
                    "click",
                    function () {

                        tasks.splice(index, 1);

                        displayTasks();

                    }
                );


            

                li.appendChild(span);

                li.appendChild(priorityText);

                li.appendChild(dateText);

                li.appendChild(completebutton);

                li.appendChild(editbutton);

                li.appendChild(deletebutton);


                taskList.appendChild(li);

            });


            updateCounter();

        }



        function updateCounter() {

            let total =
                tasks.length;


            let completed =
                tasks.filter(function (task) {

                    return task.completed === true;

                }).length;


            let pending =
                total - completed;


            counter.textContent =
                "Total: " +
                total +
                " | Completed: " +
                completed +
                " | Pending: " +
                pending;

        }


        clearbutton.addEventListener(
            "click",
            function () {

                if (tasks.length === 0) {

                    return;
                }


                let confirmClear =
                    confirm(
                        "Are you sure you want to delete all tasks?"
                    );


                if (confirmClear) {

                    tasks = [];

                    editIndex = -1;

                    addbutton.textContent =
                        "Add Task";

                    displayTasks();

                }

            }
        );



        searchInput.addEventListener(
            "input",
            function () {

                displayTasks();

            }
        );

        filter.addEventListener(
            "change",
            function () {

                displayTasks();

            }
        );


        

        taskInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    addbutton.click();

                }

            }
        );


    

        displayTasks();

    </script>

</body>

</html>
