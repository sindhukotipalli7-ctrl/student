<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: rgb(160, 125, 95);
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6b4f3a;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        .gender input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6b4f3a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4d3829;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <form id="registrationForm">

            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" placeholder="Enter your first name" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" placeholder="Enter your last name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label>Gender:</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender" value="Female" required>
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="branch">Branch:</label>

                <select id="branch" required>
                    <option value="">-- Select Branch --</option>
                    <option value="CSE">CSE</option>
                    <option value="AI">AI</option>
                    <option value="AIML">AIML</option>
                    <option value="ECE">ECE</option>
                    <option value="AGR">AGR</option>
                    <option value="DS">DS</option>
                    <option value="CYBER">CYBER</option>
                </select>
            </div>

            <button type="submit">Submit</button>

            <p id="message"></p>

        </form>
    </div>

    <script>

        const form = document.getElementById("registrationForm");


        const message = document.getElementById("message");

    
        form.addEventListener("submit", function (event) {


            event.preventDefault();

            
            const firstName = document.getElementById("firstName").value;
            const lastName = document.getElementById("lastName").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const phone = document.getElementById("phone").value;
            const branch = document.getElementById("branch").value;

            
            const gender = document.querySelector(
                'input[name="gender"]:checked'
            );
            if (!gender) {
                message.textContent = "Please select your gender.";
                message.style.color = "red";
                return;
            }

            
            message.textContent =
                "Registration successful, " + firstName + " " + lastName + "!";

            message.style.color = "green";

            
            console.log("First Name:", firstName);
            console.log("Last Name:", lastName);
            console.log("Email:", email);
            console.log("Password:", password);
            console.log("Phone:", phone);
            console.log("Gender:", gender.value);
            console.log("Branch:", branc);
            form.reset();
        });

    </script>

</body>

</html>
